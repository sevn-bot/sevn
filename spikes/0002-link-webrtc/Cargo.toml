[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/peer-webrtcrs",
    "crates/peer-str0m",
    "crates/signal",
]

[package]
name = "spike-0002-link-webrtc"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "spike-peer"
path = "src/bin/spike-peer.rs"

[[bin]]
name = "spike-measure"
path = "src/bin/spike-measure.rs"

[dependencies]
common = { path = "crates/common" }
libc = "0.2"
signal = { path = "crates/signal" }

[dev-dependencies]
common = { path = "crates/common" }
signal = { path = "crates/signal" }
sha2 = "0.10"
