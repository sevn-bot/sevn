[package]
name = "peer-str0m"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
rtc-shared = { package = "rtc-shared", version = "=0.21.1" }
rtc-turn = { package = "rtc-turn", version = "=0.21.1", default-features = false, features = ["crypto-aws-lc-rs"] }
rustls = "0.23"
sansio = "1"
serde_json = "1"
signal = { path = "../signal" }
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
