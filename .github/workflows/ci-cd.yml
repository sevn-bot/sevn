# Active artifact-publication pipeline: triggers on push to main, v* tags, and
# manual dispatch.
#
# SPDX-License-Identifier: MIT
#
# Container artifact publication pipeline (phase4/phase5 production deploy stubs).
# Normative spec: about-sevn.bot/specs/25-cicd-full.md.
#
# publish-ghcr: builds sandbox/proxy/gateway images and pushes a quarantine tag
# only (`:quarantine-<sha>-<run_id>`). Digests are job outputs for
# container-supply-chain (trivy → cosign → syft → promote SHA / version tags by
# digest). No consumable tag exists before the scan (C12.3 / D45). `:latest` is
# not written while phase4/5 are stubs (C13.1).
#
# Trigger → phase mapping (specs/25-cicd-full.md Workflow matrix):
#   push to main         → phase1 → publish-ghcr → supply-chain
#                          (phase4/5/6 + verify-deployment skipped — Dev deploy/smoke deleted, D44)
#   push tag 'v*'        → phase1 → publish-ghcr → supply-chain → verify-deployment
#                          → phase4 → phase5 → phase6
#                          (Production deploy/test stubs must succeed; phase6 is draft-only;
#                           verify-deployment fails on driver_unavailable — D52)
#   workflow_dispatch    → phase1 → publish-ghcr → supply-chain → verify-deployment
#                          → phase4 → phase5
#                          (+ phase6 when ref is a v* tag; stub failures + driver_unavailable
#                          fail the required gate)
#
# Required check (branch protection): job id `delivery-chain`, display name
# "Artifact publication gate (required)". A green check proves phase1 + GHCR
# publish + supply-chain succeeded (and, on tags, that phase4/5 did not fail).
# It does NOT prove Dev/Prod deploy readiness — those phases are stubs or absent.
#
# Pull requests are intentionally NOT triggered here. The single PR verify gate
# is `.github/workflows/ci.yml` (Option A from the Phase 5 brief), which gates
# main/develop/test-pre. Re-running Phase 1 on PRs in two workflows would just
# double-charge runners. This publication DAG keys on `main` / `v*` only, so
# `test-pre` activity never triggers a deploy.
#
# Fork safety (specs/25-cicd-full.md §2.4):
#   This workflow does not run on pull_request at all, so fork-PR-secret leaks
#   are structurally impossible here. The PR verify gate (ci.yml) runs on fork
#   PRs by GitHub default but without repository secrets.
#
# Checkout identity (specs/25-cicd-full.md §2.5):
#   `actions/checkout@v5` defaults to `${{ github.repository }}`. Any future
#   cross-repo automation (e.g. operator code-hub sync) MUST NOT override this
#   action's checkout target — that is a runtime concern, not a CI concern.
#
# Concurrency:
#   Group by commit SHA so a main push and a v* tag for the same SHA cannot
#   overlap and fight over quarantine / promotion. `cancel-in-progress: false`
#   so a tag-push deploy is never killed by an overlapping main-push run.
#   Quarantine tags are also run-scoped (`quarantine-<sha>-<run_id>`) so failure
#   cleanup cannot delete another run's package version.

name: CI/CD (artifact publication)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: prod-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  phase1:
    name: Phase 1 — Verify CI
    # Run on main pushes and manual dispatch. Tag pushes also re-run Phase 1
    # so the tagged SHA's verify is re-confirmed before production deploy
    # (specs/25-cicd-full.md §2.3 "Tag eligibility").
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/bootstrap

      - name: Full gate
        run: make ci

  publish-ghcr:
    name: Publish container images to GHCR
    needs: [phase1]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      ))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image_repo.outputs.repository }}
      sandbox_digest: ${{ steps.sandbox.outputs.digest }}
      proxy_digest: ${{ steps.proxy.outputs.digest }}
      gateway_digest: ${{ steps.gateway.outputs.digest }}
      gateway_browser_digest: ${{ steps.gateway_browser.outputs.digest }}
      gateway_gui_digest: ${{ steps.gateway_gui.outputs.digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set lowercase image prefix
        id: image_repo
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPOSITORY=$repo" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Quarantine-only push (C12.3 / C13.1 / D45): no SHA, version, or :latest
      # until container-supply-chain promotes by digest after scan → sign.
      # Tags are run-scoped so overlapping publishes for the same SHA cannot
      # delete each other's quarantine versions on failure cleanup.
      - name: Build and push sandbox image
        id: sandbox
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/sandbox:quarantine-${{ github.sha }}-${{ github.run_id }}

      # Bake the sandbox digest into gateway artifacts before they COPY src/
      # (C4.1 / W7.4). Without this, published gateway images keep sha256:UNSTAMPED
      # and boot skips validation while first default spawn fails closed.
      - name: Stamp sandbox digest into gateway source
        env:
          SEVN_SANDBOX_IMAGE_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${SEVN_SANDBOX_IMAGE_DIGEST}"
          python3 scripts/stamp_default_sandbox_image.py
          python3 scripts/check_sandbox_mutable_image_tags.py --require-stamped

      - name: Build and push proxy image
        id: proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.proxy
          push: true
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/proxy:quarantine-${{ github.sha }}-${{ github.run_id }}

      - name: Build and push gateway image
        id: gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          build-args: |
            SEVN_SANDBOX_IMAGE_DIGEST=${{ steps.sandbox.outputs.digest }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway:quarantine-${{ github.sha }}-${{ github.run_id }}

      - name: Build and push gateway browser image
        id: gateway_browser
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.gateway.browser
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SEVN_SANDBOX_IMAGE_DIGEST=${{ steps.sandbox.outputs.digest }}
          cache-from: type=gha,scope=gateway-browser
          cache-to: type=gha,mode=max,scope=gateway-browser
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway.browser:quarantine-${{ github.sha }}-${{ github.run_id }}

      - name: Build and push gateway GUI image
        id: gateway_gui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.gateway.gui
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SEVN_SANDBOX_IMAGE_DIGEST=${{ steps.sandbox.outputs.digest }}
          cache-from: type=gha,scope=gateway-gui
          cache-to: type=gha,mode=max,scope=gateway-gui
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway.gui:quarantine-${{ github.sha }}-${{ github.run_id }}

      # Runs inside publish-ghcr so a mid-push failure still cleans partial
      # quarantine tags (container-supply-chain is skipped when publish fails).
      - name: Cleanup quarantine tags on failure
        if: failure() || cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/ghcr_quarantine_cleanup.sh
          delete_quarantine_tags "${IMAGE_REPOSITORY}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}"

  container-supply-chain:
    name: Container supply chain (cosign, syft, trivy)
    needs: [publish-ghcr]
    if: needs.publish-ghcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_REPOSITORY: ${{ needs.publish-ghcr.outputs.image_repository }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      # C11.1 / D46: SHA-pinned installers (same pattern as cosign above). Versions
      # stay at syft v1.18.1 / trivy v0.58.1 so scan_image() + allowlist tooling keep
      # working against the same CLI surface.
      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.18.1

      - name: Add syft to PATH
        run: echo "$(dirname '${{ steps.syft.outputs.cmd }}')" >> "$GITHUB_PATH"

      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.58.1
          cache: "true"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan, sign, and SBOM published images
        env:
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
          GATEWAY_BROWSER_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_browser_digest }}
          GATEWAY_GUI_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_gui_digest }}
        run: |
          set -euo pipefail
          mkdir -p sboms
          scan_image() {
            local name="$1"
            local digest="$2"
            local ref="ghcr.io/$IMAGE_REPOSITORY/$name@$digest"
            local ignorefile
            ignorefile="$(mktemp)"
            python3 scripts/trivy_ignore_args.py --image "$name" --output "$ignorefile"
            echo "=== $ref ==="
            # Block on new CRITICAL/HIGH findings; allowlist via security/trivy-allowlist.toml (#173, D23).
            trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
              --ignorefile "$ignorefile" \
              --format json -o "sboms/$name.trivy.json" \
              "$ref"
            trivy convert --format sarif --output "sboms/$name.trivy.sarif" "sboms/$name.trivy.json"
            cosign sign --yes "$ref"
            syft "$ref" -o spdx-json > "sboms/$name.spdx.json"
          }
          scan_image sandbox "$SANDBOX_DIGEST"
          scan_image proxy "$PROXY_DIGEST"
          scan_image gateway "$GATEWAY_DIGEST"
          scan_image gateway.browser "$GATEWAY_BROWSER_DIGEST"
          scan_image gateway.gui "$GATEWAY_GUI_DIGEST"

      - name: Promote stable tags by digest
        env:
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
          GATEWAY_BROWSER_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_browser_digest }}
          GATEWAY_GUI_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_gui_digest }}
        run: |
          set -euo pipefail
          # C12.3 / D45: promote SHA (and version on v* tags) by digest after scan→sign.
          # :latest is not written while phase4/5 are stubs (C13.1).
          promote_by_digest() {
            local name="$1"
            local digest="$2"
            local src="ghcr.io/${IMAGE_REPOSITORY}/${name}@${digest}"
            local sha_tag="ghcr.io/${IMAGE_REPOSITORY}/${name}:${GITHUB_SHA}"
            echo "Promote by digest: ${src} → ${sha_tag}"
            docker buildx imagetools create --tag "${sha_tag}" "${src}"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              local ver_tag="ghcr.io/${IMAGE_REPOSITORY}/${name}:${GITHUB_REF_NAME}"
              echo "Promote by digest: ${src} → ${ver_tag}"
              docker buildx imagetools create --tag "${ver_tag}" "${src}"
            fi
          }
          promote_by_digest sandbox "$SANDBOX_DIGEST"
          promote_by_digest proxy "$PROXY_DIGEST"
          promote_by_digest gateway "$GATEWAY_DIGEST"
          promote_by_digest gateway.browser "$GATEWAY_BROWSER_DIGEST"
          promote_by_digest gateway.gui "$GATEWAY_GUI_DIGEST"

      - name: Upload supply-chain reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-supply-chain-${{ github.sha }}
          path: sboms/
          if-no-files-found: error

      # Runs inside container-supply-chain so a scan/sign/promote failure still
      # cleans partial quarantine tags (C-9.5 / D52). Mirrors publish-ghcr's
      # cleanup step at the head of the release path.
      - name: Cleanup quarantine tags on failure
        if: failure() || cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/ghcr_quarantine_cleanup.sh
          delete_quarantine_tags "${IMAGE_REPOSITORY}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}"

  verify-deployment:
    name: Deployment drivers (fails on driver_unavailable)
    # Tag-path verification — a release that cannot run its own verification
    # has not been verified (D52, prod-readiness W23.2). exit 0 pass,
    # exit 1 fail, exit 2 driver_unavailable — ALL three are surfaced as
    # job failures on the tag path. Drivers run against the published
    # container images (no override required); a passing run here is the
    # C14.1 / C14.2 / C14.3 evidence the release body cites.
    needs: [phase1, publish-ghcr, container-supply-chain]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/bootstrap

      - name: Run deployment drivers (release path — fail on driver_unavailable)
        # Exit 0 pass / exit 1 fail / exit 2 driver_unavailable; all three
        # non-zero codes fail the job here. A green job that skipped the
        # drivers would be worse than no job, so we let any non-zero exit
        # propagate.
        env:
          IMAGE_REPOSITORY: ${{ needs.publish-ghcr.outputs.image_repository }}
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
          GATEWAY_BROWSER_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_browser_digest }}
          GATEWAY_GUI_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_gui_digest }}
        run: make verify-deployment

      - name: Upload deployment evidence (evidence/verify/*.json)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-verification-${{ github.sha }}
          path: evidence/verify/
          if-no-files-found: error

      - name: Cleanup quarantine tags on failure
        if: failure() || cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/ghcr_quarantine_cleanup.sh
          delete_quarantine_tags "${IMAGE_REPOSITORY}" "${GITHUB_SHA}" "${GITHUB_RUN_ID}"

  # Dev deploy/smoke (former phase2/phase3) deleted with needs_impl_ok (D44 / C2.2).
  # Production stubs below remain so tag builds still require honest deploy/test success (C2.3).

  phase4:
    name: Phase 4 — Deploy → Production (needs-implementation)
    needs: [phase1, publish-ghcr, container-supply-chain]
    environment: production
    # Production deploy is tag-gated by default (specs/25-cicd-full.md §2.3).
    # On manual dispatch we also allow this so the full chain is exercisable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ needs.publish-ghcr.outputs.image_repository }}
    steps:
      - name: needs-implementation — deploy tagged SHA to Production environment
        env:
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
          GATEWAY_BROWSER_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_browser_digest }}
          GATEWAY_GUI_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_gui_digest }}
        run: |
          echo "Pinned images for Production deploy (digest, not :latest):"
          echo "  sandbox:         ghcr.io/${IMAGE_REPOSITORY}/sandbox@${SANDBOX_DIGEST}"
          echo "  proxy:           ghcr.io/${IMAGE_REPOSITORY}/proxy@${PROXY_DIGEST}"
          echo "  gateway:         ghcr.io/${IMAGE_REPOSITORY}/gateway@${GATEWAY_DIGEST}"
          echo "  gateway.browser: ghcr.io/${IMAGE_REPOSITORY}/gateway.browser@${GATEWAY_BROWSER_DIGEST}"
          echo "  gateway.gui:     ghcr.io/${IMAGE_REPOSITORY}/gateway.gui@${GATEWAY_GUI_DIGEST}"
          echo "Tag: ${{ github.ref }}"
          echo "::error title=needs-implementation::Phase 4 (Deploy → Production) is not implemented — see specs/25-cicd-full.md §2.1 and §2.3"
          exit 1

  phase5:
    name: Phase 5 — Test Production (needs-implementation)
    needs: [phase4]
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: needs-implementation — read-only production probes
        run: |
          echo "::error title=needs-implementation::Phase 5 (Test Production) is not implemented — see specs/25-cicd-full.md §2.1"
          exit 1

  phase6:
    name: Phase 6 — Release
    # Tag releases require successful deploy/test phases (D22). Phase6 stays draft-only
    # until phases 4–5 are implemented (#172, D21).
    needs: [phase1, publish-ghcr, container-supply-chain, phase4, phase5]
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download supply-chain reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-supply-chain-${{ github.sha }}
          path: sboms

      - name: Download deployment evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deployment-verification-${{ github.sha }}
          path: evidence/verify

      - name: Create GitHub Release (tagged build)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            sboms/**
            evidence/verify/*.json
          body: |
            **Draft release — no production deploy occurred.**

            Phases 4–5 (production deploy and smoke) are not yet implemented.
            Container images were published to GHCR; this release is for artifact
            tracking only until deploy phases land.

            Attached: Trivy JSON/SARIF reports and SPDX SBOMs from container-supply-chain,
            plus the deployment-verification JSON evidence (compose profiles, stack
            health, sandbox spawn, runtime, authenticated round-trip, volume upgrade,
            browser/GUI boot, cancellation cleanup, sandbox scoped-token).

  delivery-chain:
    # Branch-protection required check name (C2.1). Job id stays `delivery-chain`
    # for stable references; the display name is what GitHub status checks show.
    name: Artifact publication gate (required)
    needs:
      - phase1
      - publish-ghcr
      - container-supply-chain
      - phase4
      - phase5
      - phase6
      - verify-deployment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify delivery chain results
        env:
          PHASE1: ${{ needs.phase1.result }}
          PUBLISH: ${{ needs.publish-ghcr.result }}
          SUPPLY: ${{ needs.container-supply-chain.result }}
          PHASE4: ${{ needs.phase4.result }}
          PHASE5: ${{ needs.phase5.result }}
          PHASE6: ${{ needs.phase6.result }}
          VERIFY_DEPLOYMENT: ${{ needs.verify-deployment.result }}
        run: |
          set -euo pipefail
          # Accept success or skipped only. A failed needed job fails this gate (P3 / D44).
          # main push: phase4/5/6 are skipped by their `if` → skipped is fine.
          # tag push: phase4/5 must succeed (stubs currently fail → gate red).
          # workflow_dispatch: phase4/5 run as stubs; a failed stub fails this gate.
          # verify-deployment runs only on tag + dispatch (C14.1, D52) — on a
          # main push it is skipped, which the `ok` predicate accepts.
          ok() { case "$1" in success|skipped) return 0;; *) return 1;; esac; }
          fail=0
          require() {
            local label="$1" result="$2"
            if ok "$result"; then
              echo "OK  $label ($result)"
            else
              echo "::error title=Artifact publication::$label result=$result"
              fail=1
            fi
          }
          require "phase1" "$PHASE1"
          require "publish-ghcr" "$PUBLISH"
          require "container-supply-chain" "$SUPPLY"
          require "phase4" "$PHASE4"
          require "phase5" "$PHASE5"
          require "phase6" "$PHASE6"
          require "verify-deployment" "$VERIFY_DEPLOYMENT"
          exit "$fail"
