# Active delivery pipeline: triggers on push to main, v* tags, and manual dispatch.
#
# SPDX-License-Identifier: MIT
#
# Six-phase delivery pipeline.
# Normative spec: specs/25-cicd-full.md (Phase 5 of the build).
#
# publish-ghcr: pushes sandbox/proxy/gateway images to GHCR on main, v* tags,
# and workflow_dispatch (manual chain rehearsal). Digests are job outputs for
# downstream phases and container-supply-chain (cosign, syft, trivy).
#
# Trigger → phase mapping (specs/25-cicd-full.md §2.3):
#   push to main         → phase1 → phase2 → phase3        (build/deploy Dev + smoke)
#   push tag 'v*'        → phase4 → phase5 → phase6        (production deploy + release)
#   workflow_dispatch    → full chain phase1…phase6        (manual / break-glass)
#
# Pull requests are intentionally NOT triggered here. The single PR verify gate
# is `.github/workflows/ci.yml` (Option A from the Phase 5 brief), which gates
# main/develop/test-pre. Re-running Phase 1 on PRs in two workflows would just
# double-charge runners. This delivery DAG keys on `main` / `v*` only, so
# `test-pre` activity never triggers a deploy.
#
# Fork safety (specs/25-cicd-full.md §2.4):
#   This workflow does not run on pull_request at all, so fork-PR-secret leaks
#   are structurally impossible here. The PR verify gate (ci.yml) runs on fork
#   PRs by GitHub default but without repository secrets.
#
# Checkout identity (specs/25-cicd-full.md §2.5):
#   `actions/checkout@v5` defaults to `${{ github.repository }}`. Any future
#   cross-repo automation (e.g. operator code-hub sync) MUST NOT override this
#   action's checkout target — that is a runtime concern, not a CI concern.
#
# Concurrency:
#   One workflow-level group keyed on the ref so only one production deploy
#   can run for a given tag/branch at a time. `cancel-in-progress: false` so
#   a tag-push deploy is never killed by an overlapping main-push run.

name: CI/CD (six-phase delivery)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase1:
    name: Phase 1 — Verify CI
    # Run on main pushes and manual dispatch. Tag pushes also re-run Phase 1
    # so the tagged SHA's verify is re-confirmed before production deploy
    # (specs/25-cicd-full.md §2.3 "Tag eligibility").
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/bootstrap

      - name: Full gate
        run: make ci

  publish-ghcr:
    name: Publish container images to GHCR
    needs: [phase1]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      ))
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'development' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image_repo.outputs.repository }}
      sandbox_digest: ${{ steps.sandbox.outputs.digest }}
      proxy_digest: ${{ steps.proxy.outputs.digest }}
      gateway_digest: ${{ steps.gateway.outputs.digest }}
      gateway_browser_digest: ${{ steps.gateway_browser.outputs.digest }}
      gateway_gui_digest: ${{ steps.gateway_gui.outputs.digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set lowercase image prefix
        id: image_repo
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPOSITORY=$repo" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sandbox image
        id: sandbox
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.sandbox
          push: true
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/sandbox:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/sandbox:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/sandbox:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}

      - name: Build and push proxy image
        id: proxy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.proxy
          push: true
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/proxy:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/proxy:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/proxy:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}

      - name: Build and push gateway image
        id: gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.gateway
          push: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/gateway:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}

      - name: Build and push gateway browser image
        id: gateway_browser
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.gateway.browser
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=gateway-browser
          cache-to: type=gha,mode=max,scope=gateway-browser
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway.browser:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway.browser:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/gateway.browser:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}

      - name: Build and push gateway GUI image
        id: gateway_gui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.gateway.gui
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=gateway-gui
          cache-to: type=gha,mode=max,scope=gateway-gui
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway.gui:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/gateway.gui:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/gateway.gui:{1}', env.IMAGE_REPOSITORY, github.ref_name) || '' }}

  container-supply-chain:
    name: Container supply chain (cosign, syft, trivy)
    needs: [publish-ghcr]
    if: needs.publish-ghcr.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_REPOSITORY: ${{ needs.publish-ghcr.outputs.image_repository }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.18.1/install.sh | sh -s -- -b /usr/local/bin

      - name: Install trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.58.1/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign, SBOM, and scan published images
        env:
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
          GATEWAY_BROWSER_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_browser_digest }}
          GATEWAY_GUI_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_gui_digest }}
        run: |
          set -euo pipefail
          mkdir -p sboms
          scan_image() {
            local name="$1"
            local digest="$2"
            local ref="ghcr.io/${IMAGE_REPOSITORY}/${name}@${digest}"
            echo "=== ${ref} ==="
            cosign sign --yes "$ref"
            syft "$ref" -o spdx-json > "sboms/${name}.spdx.json"
            # Report CRITICAL/HIGH; do not block publish until base images are baselined (#149).
            trivy image --exit-code 0 --severity CRITICAL,HIGH --ignore-unfixed "$ref"
          }
          scan_image sandbox "$SANDBOX_DIGEST"
          scan_image proxy "$PROXY_DIGEST"
          scan_image gateway "$GATEWAY_DIGEST"
          scan_image gateway.browser "$GATEWAY_BROWSER_DIGEST"
          scan_image gateway.gui "$GATEWAY_GUI_DIGEST"

  phase2:
    name: Phase 2 — Build & Deploy → Dev (needs-implementation)
    needs: [phase1, publish-ghcr, container-supply-chain]
    environment: development
    # Only on main push or manual dispatch; tag pushes skip Dev and go to prod.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ needs.publish-ghcr.outputs.image_repository }}
    steps:
      - name: needs-implementation — build artefacts and deploy to Dev environment
        env:
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
        run: |
          echo "Pinned images for Dev deploy (digest, not :latest):"
          echo "  sandbox:  ghcr.io/${IMAGE_REPOSITORY}/sandbox@${SANDBOX_DIGEST}"
          echo "  proxy:    ghcr.io/${IMAGE_REPOSITORY}/proxy@${PROXY_DIGEST}"
          echo "  gateway:  ghcr.io/${IMAGE_REPOSITORY}/gateway@${GATEWAY_DIGEST}"
          echo "::error title=needs-implementation::Phase 2 (Build & Deploy → Dev) is not implemented — see specs/25-cicd-full.md §2.1"
          exit 1

  phase3:
    name: Phase 3 — Test Dev (needs-implementation)
    needs: [phase2]
    environment: development
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: needs-implementation — smoke Dev topology
        run: |
          echo "::error title=needs-implementation::Phase 3 (Test Dev) is not implemented — see specs/25-cicd-full.md §2.1"
          exit 1

  phase4:
    name: Phase 4 — Deploy → Production (needs-implementation)
    needs: [phase1, publish-ghcr, container-supply-chain]
    environment: production
    # Production deploy is tag-gated by default (specs/25-cicd-full.md §2.3).
    # On manual dispatch we also allow this so the full chain is exercisable.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ needs.publish-ghcr.outputs.image_repository }}
    steps:
      - name: needs-implementation — deploy tagged SHA to Production environment
        env:
          SANDBOX_DIGEST: ${{ needs.publish-ghcr.outputs.sandbox_digest }}
          PROXY_DIGEST: ${{ needs.publish-ghcr.outputs.proxy_digest }}
          GATEWAY_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_digest }}
          GATEWAY_BROWSER_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_browser_digest }}
          GATEWAY_GUI_DIGEST: ${{ needs.publish-ghcr.outputs.gateway_gui_digest }}
        run: |
          echo "Pinned images for Production deploy (digest, not :latest):"
          echo "  sandbox:         ghcr.io/${IMAGE_REPOSITORY}/sandbox@${SANDBOX_DIGEST}"
          echo "  proxy:           ghcr.io/${IMAGE_REPOSITORY}/proxy@${PROXY_DIGEST}"
          echo "  gateway:         ghcr.io/${IMAGE_REPOSITORY}/gateway@${GATEWAY_DIGEST}"
          echo "  gateway.browser: ghcr.io/${IMAGE_REPOSITORY}/gateway.browser@${GATEWAY_BROWSER_DIGEST}"
          echo "  gateway.gui:     ghcr.io/${IMAGE_REPOSITORY}/gateway.gui@${GATEWAY_GUI_DIGEST}"
          echo "Tag: ${{ github.ref }}"
          echo "::error title=needs-implementation::Phase 4 (Deploy → Production) is not implemented — see specs/25-cicd-full.md §2.1 and §2.3"
          exit 1

  phase5:
    name: Phase 5 — Test Production (needs-implementation)
    needs: [phase4]
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: needs-implementation — read-only production probes
        run: |
          echo "::error title=needs-implementation::Phase 5 (Test Production) is not implemented — see specs/25-cicd-full.md §2.1"
          exit 1

  phase6:
    name: Phase 6 — Release
    # Decoupled from deploy phases so tag releases succeed while phase4/5 remain stubs (#149).
    needs: [phase1, publish-ghcr, container-supply-chain]
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Create GitHub Release (tagged build)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          body: |
            **Draft release — no production deploy occurred.**

            Phases 4–5 (production deploy and smoke) are not yet implemented.
            Container images were published to GHCR; this release is for artifact
            tracking only until deploy phases land.

  delivery-chain:
    name: Delivery chain gate (required)
    needs:
      - phase1
      - publish-ghcr
      - container-supply-chain
      - phase2
      - phase3
      - phase4
      - phase5
      - phase6
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify delivery chain results
        env:
          PHASE1: ${{ needs.phase1.result }}
          PUBLISH: ${{ needs.publish-ghcr.result }}
          SUPPLY: ${{ needs.container-supply-chain.result }}
          PHASE2: ${{ needs.phase2.result }}
          PHASE3: ${{ needs.phase3.result }}
          PHASE4: ${{ needs.phase4.result }}
          PHASE5: ${{ needs.phase5.result }}
          PHASE6: ${{ needs.phase6.result }}
        run: |
          set -euo pipefail
          ok() { case "$1" in success|skipped) return 0;; *) return 1;; esac; }
          needs_impl_ok() { case "$1" in success|skipped|failure) return 0;; *) return 1;; esac; }
          fail=0
          require() {
            local label="$1" result="$2"
            if ok "$result"; then
              echo "OK  $label ($result)"
            else
              echo "::error title=Delivery chain::$label result=$result"
              fail=1
            fi
          }
          require_needs_impl() {
            local label="$1" result="$2"
            if needs_impl_ok "$result"; then
              echo "OK  $label ($result — needs-implementation stub allowed)"
            else
              echo "::error title=Delivery chain::$label result=$result"
              fail=1
            fi
          }
          require "phase1" "$PHASE1"
          require "publish-ghcr" "$PUBLISH"
          require "container-supply-chain" "$SUPPLY"
          require_needs_impl "phase2" "$PHASE2"
          require_needs_impl "phase3" "$PHASE3"
          require_needs_impl "phase4" "$PHASE4"
          require_needs_impl "phase5" "$PHASE5"
          require "phase6" "$PHASE6"
          exit "$fail"
