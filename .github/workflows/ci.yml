name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup
        run: make setup

      - name: Install Playwright browsers
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: CI
        run: make ci

  # Plan 0025 D12: the host suite on Arch Linux (the Omarchy base); the web
  # dependencies are installed because the contracts check runs json2ts. The
  # container is privileged so the bubblewrap tests can create namespaces, and
  # the tests run as an unprivileged user that owns the checkout.
  host-arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
      options: --privileged
    steps:
      - name: Install the pacman dependencies and uv
        run: |
          pacman -Syu --noconfirm --needed bubblewrap git libsecret make procps-ng uv nodejs-lts-jod npm
          npm install -g pnpm@11.8.0

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Allow unprivileged user namespaces
        run: sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Host tests
        run: |
          useradd --create-home --uid 1001 builder
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder sh -c \
            'pnpm --dir web install --frozen-lockfile && uv sync --all-packages --all-groups --python 3.13 && make test-host'

  # Plan 0025 D12: shellcheck, then deploy/install.sh from a built wheel in
  # clean Ubuntu 24.04 and Arch Linux containers, then `sevn doctor --json`.
  install-sh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "archlinux:base"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: shellcheck
        run: shellcheck -s sh deploy/install.sh

      - name: Build the wheel
        run: |
          pnpm --dir web install --frozen-lockfile
          make wheel

      - name: install.sh in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # An Arch install has synced package databases; the image ships none.
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/out:/out" -w /src "$IMAGE" sh -c '
            set -eu
            if command -v pacman >/dev/null 2>&1; then pacman -Syu --noconfirm; fi
            sh deploy/install.sh --no-service --wheel dist/sevn-*-py3-none-any.whl
            "$HOME/.local/bin/sevn" doctor --json > /out/doctor.json
          '
          cat "$RUNNER_TEMP/out/doctor.json"
          jq -e '.platform == "container" and .bubblewrap != null and .version != null' \
            "$RUNNER_TEMP/out/doctor.json"

  # Plan 0025 D12: build both images, run each, wait for /health, and check
  # that `sevn runtimes list` reports every manifest runtime as managed.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [deploy/Dockerfile, deploy/Dockerfile.ubuntu]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build ${{ matrix.dockerfile }}
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" -t sevn:ci .

      - name: Run and wait for /health
        run: |
          docker run -d --name sevn-ci -p 127.0.0.1:8787:8787 sevn:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health; then exit 0; fi
            sleep 2
          done
          docker logs sevn-ci
          exit 1

      - name: Every manifest runtime is managed
        run: |
          docker exec sevn-ci sevn runtimes list --json > runtimes.json
          cat runtimes.json
          python3 - <<'EOF'
          import json
          import tomllib

          with open("host/src/sevn/runtime/manifest.toml", "rb") as handle:
              manifest = tomllib.load(handle)["runtimes"]
          with open("runtimes.json", encoding="utf-8") as handle:
              listed = json.load(handle)
          for name, pin in manifest.items():
              entry = listed.get(name)
              assert entry is not None, f"{name} missing from sevn runtimes list"
              assert entry["used"] == "managed", (name, entry)
              assert entry["current"] == pin["version"], (name, entry, pin["version"])
          print("managed:", ", ".join(sorted(manifest)))
          EOF

      - name: Container logs
        if: failure()
        run: docker logs sevn-ci || true
