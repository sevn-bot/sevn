# mergeCraft PR review (BYOK). https://github.com/alexhawat/mergeCraft
#
# Reviewer: OpenCode Go subscription, model opencode-go/deepseek-v4.1-flash.
# That is the primary rung in alexhawat/mergeCraft's own review workflow.
# Backup: when that run fails without posting a verdict on a pull request (for
# example, the Go plan's usage limit is reached), .github/scripts/
# mergecraft_sdk_review.py reviews it through mergeCraft's OpenAI Agents SDK
# integration on the runner, using the OPENAI_API_KEY secret with OpenAI's
# regular API, not the Codex CLI. The model defaults to openai/gpt-5.6-terra;
# set the MERGECRAFT_AGENTS_SDK_MODEL repository variable to change it. Without
# the secret the backup is skipped.
# The pin is the v0.1.0a7 release commit; its action.yml pins the signed reviewer
# image by digest. Bump it with docs/upgrade.md in alexhawat/mergeCraft.
#
# Trigger is pull_request, not pull_request_target. This job is not a required
# ruleset, and pull_request keeps repository secrets out of fork runs. The
# credential is passed only for workflow_dispatch and same-repo pull requests.
# push and shell stay disabled: a review must not run pull-request scripts or
# push commits.
name: mergeCraft

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths-ignore:
      - 'host/evals/**/*.jsonl'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for the agent
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mergecraft-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mergecraft:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Room for the 40-minute review plus the 30-minute backup: the action's
    # timeout must end before the job's, or it never posts its completion check.
    timeout-minutes: 80
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      # Lets the reviewer read this PR's and the base branch's CI runs, so a
      # failure already on the base is not blamed on the PR.
      actions: read
    env:
      # Fork pull_request runs receive an empty secret. The same-repo clause
      # stays even if the trigger later changes.
      HAS_OPENCODE_GO: ${{ secrets.LLM_PROVIDER_9_API_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
      HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not persist the checkout token into .git/config: mergeCraft adds
          # its own Authorization header, and git sends both on one request.
          persist-credentials: false
          # The backup review diffs the pull request against its base commit.
          fetch-depth: 0

      - name: Run mergeCraft
        id: review_opencode_go
        if: env.HAS_OPENCODE_GO == 'true'
        # A failure here hands the review to the backup below; the last step
        # fails the job when no run produced a review.
        continue-on-error: true
        uses: alexhawat/mergeCraft@ca65b4c95c7afbbefa58033cea1b31b1197d0372 # v0.1.0a7
        with:
          prompt: >
            ${{ github.event_name == 'pull_request'
                && 'Review this pull request.'
                || github.event.inputs.prompt }}
          model: opencode-go/deepseek-v4.1-flash
          ignore_paths: |
            host/evals/**/*.jsonl
            CHANGELOG.md
          model_pin: enabled
          push: disabled
          shell: disabled
          status_checks: enabled
          timeout: 40m
        env:
          # Keep equal to the uses: commit above. The container cannot read it.
          MERGECRAFT_ACTION_SHA: ca65b4c95c7afbbefa58033cea1b31b1197d0372
          LLM_PROVIDER_9: opencode-go
          OPENCODE_GO_API_KEY: ${{ secrets.LLM_PROVIDER_9_API_KEY }}

      # Fall back only when the first run posted no verdict. A success or
      # failure verdict is a real review, and a second model must not override it.
      - name: Decide whether the OpenAI backup reviews
        id: decide
        if: github.event_name == 'pull_request' && env.HAS_OPENAI == 'true'
        env:
          OUTCOME: ${{ steps.review_opencode_go.outcome }}
          PACKET: ${{ steps.review_opencode_go.outputs.evidence_packet }}
        run: |
          set -euo pipefail
          verdict="$(printf '%s' "${PACKET}" | jq -r '.decision.verdict // empty' 2>/dev/null || true)"
          need=false
          if [ "${OUTCOME}" = "skipped" ]; then
            need=true
            echo "::notice title=mergeCraft backup::No OpenCode Go credential for this run; reviewing with OpenAI."
          elif [ "${OUTCOME}" = "failure" ]; then
            case "${verdict}" in
              success|failure)
                echo "OpenCode Go posted a ${verdict} verdict before failing; not falling back." ;;
              *)
                need=true
                echo "::notice title=mergeCraft backup::OpenCode Go review failed with no verdict (${verdict:-none}); reviewing with OpenAI." ;;
            esac
          fi
          echo "need=${need}" >> "${GITHUB_OUTPUT}"

      - name: Install mergeCraft's Agents SDK integration
        if: steps.decide.outputs.need == 'true'
        run: |
          python3 -m venv "${RUNNER_TEMP}/mergecraft-sdk"
          "${RUNNER_TEMP}/mergecraft-sdk/bin/pip" install --quiet 'mergecraft-action[agents]==0.1.0a7'

      # Sees OPENAI_API_KEY but no GitHub token; the post step below is the reverse.
      - name: Review with the OpenAI Agents SDK (backup)
        id: sdk_review
        if: steps.decide.outputs.need == 'true'
        timeout-minutes: 30
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MERGECRAFT_AGENTS_SDK_MODEL: ${{ vars.MERGECRAFT_AGENTS_SDK_MODEL || 'openai/gpt-5.6-terra' }}
          # Keep pull-request content out of OpenAI's trace dashboard.
          OPENAI_AGENTS_DISABLE_TRACING: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The script reads the base and head commits from git objects, not the
          # working tree, which the first review leaves root-owned and changed.
          "${RUNNER_TEMP}/mergecraft-sdk/bin/python" .github/scripts/mergecraft_sdk_review.py review \
            --base "${BASE_SHA}" --head "${HEAD_SHA}" --pr "${PR_NUMBER}" --title "${PR_TITLE}" \
            --out "${RUNNER_TEMP}/mergecraft-sdk-report.json"

      - name: Post the backup review
        if: always() && steps.decide.outputs.need == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/mergecraft_sdk_review.py post \
            --report "${RUNNER_TEMP}/mergecraft-sdk-report.json" --pr "${PR_NUMBER}" --head-sha "${HEAD_SHA}"

      - name: Fail when no run produced a review
        if: steps.review_opencode_go.outcome == 'failure' && steps.decide.outputs.need != 'true'
        run: |
          echo "::error title=mergeCraft::The OpenCode Go review failed and the OpenAI backup did not run (no OPENAI_API_KEY secret, not a pull request, or the failed run had already posted a verdict)."
          exit 1

      - name: Skip review without a reviewer credential
        if: env.HAS_OPENCODE_GO != 'true' && env.HAS_OPENAI != 'true'
        run: echo "::notice title=mergeCraft::No same-repo OpenCode Go or OpenAI credential for this run, so review was skipped."
