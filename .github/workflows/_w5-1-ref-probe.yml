name: W5.1 ref-shape probe — caller
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/_w5-1-ref-probe.yml'
      - '.github/workflows/_w5-1-ref-probe-impl.yml'

jobs:
  # Three shapes, three jobs.
  # All three reference the same impl file. Differences are only in the ref suffix.
  probe-branch-ref:
    # Branch ref (the original W5.1 question). The impl exists on this
    # branch (the probe branch). GitHub resolves `uses: owner/repo/.github/...
    # @branch` against the branch ref.
    uses: sevn-bot/sevn/.github/workflows/_w5-1-ref-probe-impl.yml@wave/ci-b-w5-1-ref-probe
    with:
      probe_ref: 'wave/ci-b-w5-1-ref-probe (branch ref)'
  probe-sha-ref:
    # Full SHA — GitHub docs: required when sha_pinning_required=true.
    # The impl exists at this SHA (the commit the impl landed in).
    uses: sevn-bot/sevn/.github/workflows/_w5-1-ref-probe-impl.yml@a3ccb61a6fad49598c8abdd79931a6dd99adb693
    with:
      probe_ref: 'a3ccb61a (full SHA)'