name: debug-ci

on:
  push:
    branches: [wave/0020-bot-core]

permissions:
  issues: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 6275593447 6275748354 6276007091; do
            gh api -X DELETE "repos/sevn-bot/sevn/issues/comments/$id" || true
          done
