name: debug-ci

on:
  push:
    branches: [wave/0020-bot-core]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup
        run: make setup

      - name: Install Playwright browsers
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: CI
        run: |
          set -o pipefail
          make ci 2>&1 | tee /tmp/ci.log

      - name: Comment failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Temporary CI diagnostic for `make ci` on this push. The workflow and this comment are removed after the failure is understood.'
            echo
            echo '```'
            tail -300 /tmp/ci.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 9 --body-file /tmp/comment.md
