name: debug-ci

on:
  push:
    branches: [wave/0020-bot-core]

concurrency:
  group: debug-ci-wave-0020
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup
        run: make setup

      - name: Install Playwright browsers
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: CI
        run: |
          set -o pipefail
          timeout 300 make ci 2>&1 | tee /tmp/ci.log

      - name: Comment the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Temporary diagnostic for the failing gate. Workflow and comment are removed once the failure is understood.'
            echo
            echo '```'
            grep -E 'FAILED|ERROR|AssertionError|Traceback|e2e/|playwright|short test summary|make: \*\*\*|Terminated' /tmp/ci.log | tail -120 || tail -80 /tmp/ci.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment 9 --body-file /tmp/comment.md
