# SPDX-License-Identifier: MIT
# Operator local stack: egress proxy + gateway (plan/telegram-e2e-wave-plan.md Wave TE-5).
# CI uses docker/docker-compose.ci.yml — do not change that file for operator workflows.
#
# Run from repo root: docker compose -f docker/docker-compose.yml up -d
#
# Persistent layout (volume sevn-state → /operator):
#   /operator/workspace/sevn.json
#   /operator/workspace/logs/gateway.log  (resolve_service_log_path / diagnostics)
#   /operator/workspace/.sevn/traces.db
#
# Default stack: sevn-operator-perms + sevn-proxy + sevn-gateway (Dockerfile.gateway).
# Browser CDP and headed GUI variants use override files (same service name, one gateway):
#   -f docker/docker-compose.browser.yml  (Brave + browser-cdp)
#   -f docker/docker-compose.gui.yml       (Brave + noVNC on 6080)
# Host-first headed browsing: run gateway on macOS with `uv sync --extra browser` instead.
#
# Gateway/proxy/browser images run as uid 10001 (`sevn`). Named volumes mount as root unless
# normalized — ``sevn-operator-perms`` chowns only paths whose ownership is wrong (D25).

x-operator-service-hardening: &operator-service-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  restart: unless-stopped

x-operator-resource-limits-proxy: &operator-resource-limits-proxy
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
        pids: 256

x-operator-resource-limits-gateway: &operator-resource-limits-gateway
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
        pids: 256

networks:
  sevn-operator:
    driver: bridge

services:
  sevn-operator-perms:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - sevn-state:/operator
      - sevn-browser-state:/browser-profiles
    command:
      - sh
      - -ec
      - |
        mkdir -p /operator /operator/workspace /operator/workspace/logs /operator/workspace/.sevn /operator/workspace/.sevn/browser-profiles /operator/workspace/.sevn/browser-sessions /browser-profiles
        find /operator ! -user 10001 -exec chown 10001:10001 {} +
        find /browser-profiles ! -user 10001 -exec chown 10001:10001 {} +
    restart: "no"

  sevn-proxy:
    <<: [*operator-service-hardening, *operator-resource-limits-proxy]
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SEVN_HOME: /operator
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - sevn-state:/operator
    networks:
      - sevn-operator
    depends_on:
      sevn-operator-perms:
        condition: service_completed_successfully
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sevn-gateway:
    <<: [*operator-service-hardening, *operator-resource-limits-gateway]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      SEVN_HOME: /operator
      HOME: /operator/workspace
      SEVN_PROXY_URL: http://sevn-proxy:8787
      SEVN_TELEGRAM_BOT_TOKEN: ${SEVN_TELEGRAM_BOT_TOKEN:-}
      SEVN_GATEWAY_TOKEN: ${SEVN_GATEWAY_TOKEN:-}
    volumes:
      - sevn-state:/operator
      - ../infra/docker-onboard.json:/bootstrap/onboard-compose.json:ro
    working_dir: /operator/workspace
    networks:
      - sevn-operator
    ports:
      - "${SEVN_GATEWAY_BIND:-127.0.0.1}:${SEVN_GATEWAY_PORT:-3001}:3001"
    depends_on:
      sevn-operator-perms:
        condition: service_completed_successfully
      sevn-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  sevn-state:
  sevn-browser-state:
