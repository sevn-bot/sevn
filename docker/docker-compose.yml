# Operator local stack: egress proxy + gateway (plan/telegram-e2e-wave-plan.md Wave TE-5).
# CI uses docker/docker-compose.ci.yml — do not change that file for operator workflows.
#
# Run from repo root: docker compose -f docker/docker-compose.yml up -d
#
# Persistent layout (volume sevn-state → /operator):
#   /operator/workspace/sevn.json
#   /operator/workspace/logs/gateway.log  (resolve_service_log_path / diagnostics)
#   /operator/workspace/.sevn/traces.db
#
# Default stack: sevn-operator-perms + sevn-proxy + sevn-gateway (Dockerfile.gateway).
# Browser CDP and headed GUI variants use override files (same service name, one gateway):
#   -f docker/docker-compose.browser.yml  (Brave + browser-cdp)
#   -f docker/docker-compose.gui.yml       (Brave + noVNC on 6080)
# Host-first headed browsing: run gateway on macOS with `uv sync --extra browser` instead.
#
# Gateway/proxy/browser images run as uid 10001 (`sevn`). Named volumes mount as root unless
# normalized — ``sevn-operator-perms`` chowns known application-owned directories only when
# the versioned marker ``/operator/.sevn/perms-v1`` is absent (C9.1 / C9.2). It does not
# walk arbitrary operator data on every ``up`` (restart: "no" re-runs the one-shot).
#
# Proxy shared secret (C1.2 / D37 / W15.5): ``sevn-operator-perms`` generates
# ``/operator/.sevn/proxy-shared-secret`` (mode 0600) on first boot when absent, then
# always chowns that path (and ``/operator/.sevn``) to uid 10001 — including when the
# marker skips the scoped migration — so gateway/proxy can read it. Ordering is single-
# service: generate → secret chown → marker-gated scoped migration. Gateway and proxy
# resolve that file when ``SEVN_PROXY_SHARED_SECRET`` is unset; an explicitly set env
# value still wins. Reuses sevn-operator-perms (not a sibling) so
# ``check-compose-default`` keeps the three-service set.
#
# C1.3 / D38: ``make compose-up`` runs ``scripts/check_compose_operator_secrets.py``
# before ``docker compose up``. Blank ``SEVN_PROXY_SHARED_SECRET`` is allowed so this
# generate-once path satisfies the preflight (W5.3); explicit ``change-me`` / short
# values for any of the three operator secrets still fail closed.
#
# C1.4 / D39: ``sevn-proxy`` healthcheck keeps ``/healthz`` (liveness) and probes
# guarded ``GET /web/auth-check`` with ``X-Sevn-Proxy-Token`` (resolved env or file).
# 503/401 → unhealthy. ``/web/auth-check`` is a no-op (no provider quota).

x-operator-service-hardening: &operator-service-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  restart: unless-stopped

x-operator-resource-limits-proxy: &operator-resource-limits-proxy
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
        pids: 256

x-operator-resource-limits-gateway: &operator-resource-limits-gateway
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
        pids: 256

# One-shot perms init — modest limits (C10.3 / D49); not merged with hardening
# (hardening sets restart: unless-stopped; this service must stay restart: "no").
x-operator-resource-limits-perms: &operator-resource-limits-perms
  pids_limit: 64
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
        pids: 64

networks:
  sevn-operator:
    driver: bridge

services:
  sevn-operator-perms:
    <<: *operator-resource-limits-perms
    image: busybox:1.36
    user: "0:0"
    volumes:
      - sevn-state:/operator
      - sevn-browser-state:/browser-profiles
    command:
      - sh
      - -ec
      - |
        mkdir -p /operator /operator/.sevn /operator/workspace /operator/workspace/logs /operator/workspace/.sevn /operator/workspace/.sevn/browser-profiles /operator/workspace/.sevn/browser-sessions /browser-profiles
        # C1.2 / D37: generate-once proxy shared secret (same path as ensure_proxy_shared_secret_file).
        # Treat blank existing file as absent so generate-once cannot stick on empty.
        if [ ! -s /operator/.sevn/proxy-shared-secret ]; then
          rm -f /operator/.sevn/proxy-shared-secret
          umask 077
          head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n\r' > /operator/.sevn/proxy-shared-secret
          chmod 600 /operator/.sevn/proxy-shared-secret
        fi
        # W15.5: secret must be uid 10001 even when the perms marker skips migration.
        chown 10001:10001 /operator/.sevn /operator/.sevn/proxy-shared-secret
        # C9.1 / C9.2: scoped application-owned dirs only; skip when /operator/.sevn/perms-v1 exists.
        if [ ! -f /operator/.sevn/perms-v1 ]; then
          find /operator/workspace ! -user 10001 -exec chown 10001:10001 {} +
          find /operator/workspace/logs ! -user 10001 -exec chown 10001:10001 {} +
          find /operator/workspace/.sevn ! -user 10001 -exec chown 10001:10001 {} +
          find /operator/workspace/.sevn/browser-profiles ! -user 10001 -exec chown 10001:10001 {} +
          find /operator/workspace/.sevn/browser-sessions ! -user 10001 -exec chown 10001:10001 {} +
          find /browser-profiles ! -user 10001 -exec chown 10001:10001 {} +
          printf '1\n' > /operator/.sevn/perms-v1
          chown 10001:10001 /operator/.sevn/perms-v1
        fi
    restart: "no"

  sevn-proxy:
    <<: [*operator-service-hardening, *operator-resource-limits-proxy]
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SEVN_HOME: /operator
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEVN_PROXY_SHARED_SECRET: ${SEVN_PROXY_SHARED_SECRET:-}
    volumes:
      - sevn-state:/operator
    networks:
      - sevn-operator
    depends_on:
      sevn-operator-perms:
        condition: service_completed_successfully
    expose:
      - "8787"
    healthcheck:
      # Liveness: /healthz. Authenticated function (C1.4 / D39): GET /web/auth-check
      # with X-Sevn-Proxy-Token from env or generate-once file; 401/503 → unhealthy.
      # /web/auth-check is a guarded no-op — no provider quota.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.error, urllib.request\nfrom pathlib import Path\nwith urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3) as r:\n r.read(0)\ns = (os.environ.get('SEVN_PROXY_SHARED_SECRET') or '').strip()\np = Path('/operator/.sevn/proxy-shared-secret')\nif not s and p.is_file():\n s = p.read_text(encoding='utf-8').strip()\nreq = urllib.request.Request('http://127.0.0.1:8787/web/auth-check', headers={'X-Sevn-Proxy-Token': s})\ntry:\n with urllib.request.urlopen(req, timeout=3) as r:\n  r.read(0)\nexcept urllib.error.HTTPError as e:\n if e.code in (401, 503):\n  raise SystemExit(1)\n raise\n",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sevn-gateway:
    <<: [*operator-service-hardening, *operator-resource-limits-gateway]
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      SEVN_HOME: /operator
      HOME: /operator/workspace
      SEVN_PROXY_URL: http://sevn-proxy:8787
      SEVN_PROXY_SHARED_SECRET: ${SEVN_PROXY_SHARED_SECRET:-}
      SEVN_TELEGRAM_BOT_TOKEN: ${SEVN_TELEGRAM_BOT_TOKEN:-}
      SEVN_GATEWAY_TOKEN: ${SEVN_GATEWAY_TOKEN:-}
    volumes:
      - sevn-state:/operator
      - ../infra/docker-onboard.json:/bootstrap/onboard-compose.json:ro
    working_dir: /operator/workspace
    networks:
      - sevn-operator
    ports:
      - "${SEVN_GATEWAY_BIND:-127.0.0.1}:${SEVN_GATEWAY_PORT:-3001}:3001"
    depends_on:
      sevn-operator-perms:
        condition: service_completed_successfully
      sevn-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  sevn-state:
  sevn-browser-state:
