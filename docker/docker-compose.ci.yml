# SPDX-License-Identifier: MIT
# Compose stack for Phase 1 CI: mock upstream + egress proxy + gateway (specs/25-cicd-full.md §4.4).
#
# C9.4: ``sevn-ci-init`` uses the same scoped+marker ownership model as operator
# ``sevn-operator-perms`` (C9.1 / C9.2) — no unconditional ``chown -R /operator``.
volumes:
  sevn-ci-workspace:

services:
  sevn-ci-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - ../infra/ci-workspace:/seed:ro
      - sevn-ci-workspace:/operator
    command:
      - sh
      - -ec
      - |
        mkdir -p /operator /operator/.sevn /operator/workspace /operator/workspace/logs /operator/workspace/.sevn
        cp -a /seed/sevn.json /operator/workspace/sevn.json
        if [ -d /seed/.sevn ]; then cp -a /seed/.sevn /operator/workspace/.sevn; fi
        # C9.1 / C9.2 / C9.4: scoped application-owned dirs; skip when marker present.
        if [ ! -f /operator/.sevn/perms-v1 ]; then
          find /operator/workspace ! -user 10001 -exec chown 10001:10001 {} +
          find /operator/workspace/logs ! -user 10001 -exec chown 10001:10001 {} +
          find /operator/workspace/.sevn ! -user 10001 -exec chown 10001:10001 {} +
          printf '1\n' > /operator/.sevn/perms-v1
          chown 10001:10001 /operator/.sevn /operator/.sevn/perms-v1
        fi
    restart: "no"

  mock-openai:
    build:
      context: ../infra/ci-mock-openai
    expose:
      - "9090"

  sevn-proxy:
    image: sevn-proxy:ci
    # pull_policy:never + a matching local tag lets jobs that pre-build the
    # image (load:true via build-push-action) run `up --no-build` and reuse it
    # deterministically. Jobs that still `docker compose build` keep working:
    # build always rebuilds and tags sevn-proxy:ci, then up reuses it.
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    environment:
      OPENAI_API_KEY: ci-mock-key
      OPENAI_BASE_URL: http://mock-openai:9090/v1
      # Match host-side compose-ci pytest env (see .github/workflows/docker.yml).
      SEVN_PROXY_SHARED_SECRET: ci-compose-proxy-secret
    ports:
      - "18787:8787"
    depends_on:
      - mock-openai

  sevn-gateway:
    image: sevn-gateway:ci
    pull_policy: never
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    environment:
      SEVN_HOME: /operator
      HOME: /operator/workspace
      SEVN_PROXY_URL: http://sevn-proxy:8787
      SEVN_PROXY_SHARED_SECRET: ci-compose-proxy-secret
    volumes:
      # Gateway runs as uid 10001; seed from infra/ci-workspace into a writable volume.
      - sevn-ci-workspace:/operator
    working_dir: /operator/workspace
    ports:
      - "13001:3001"
    depends_on:
      sevn-ci-init:
        condition: service_completed_successfully
      sevn-proxy:
        condition: service_started
