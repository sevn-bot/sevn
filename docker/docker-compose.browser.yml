# SPDX-License-Identifier: MIT
# Browser CDP gateway override — merges with docker-compose.yml (replaces sevn-gateway).
#
# Run from repo root:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.browser.yml up -d --build
# or: make compose-browser-up
#
# SEVN_PROXY_SHARED_SECRET: explicit env overrides the generate-once file at
# /operator/.sevn/proxy-shared-secret (created by sevn-operator-perms on first boot).

services:
  sevn-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway.browser
    # Brave runs as non-root with the Chromium renderer sandbox enabled
    # (do not disable the sandbox via SEVN_BROWSER_EXTRA_ARGS).
    #
    # C8.1: keeping the renderer sandbox requires letting Brave build its own
    # namespace sandbox. Docker's default seccomp profile gates clone(CLONE_NEW*),
    # clone3 and unshare behind CAP_SYS_ADMIN and chroot behind CAP_SYS_CHROOT, so
    # under the inherited `cap_drop: ALL` Brave aborts at startup with "Failed to
    # move to new namespace". seccomp-browser.json is Docker's default profile with
    # exactly those four syscalls allowed — mount/pivot_root/setns stay gated — so
    # the container keeps cap_drop:ALL + no-new-privileges:true AND the browser
    # sandboxes its own renderers. See docker/README.md § Browser sandbox.
    # (no-new-privileges:true is inherited from the base service; Compose
    # concatenates security_opt, so repeating it here is a config error.)
    security_opt:
      - seccomp=../infra/docker/seccomp-browser.json
    environment:
      SEVN_HOME: /operator
      HOME: /operator/workspace
      SEVN_PROXY_URL: http://sevn-proxy:8787
      SEVN_PROXY_SHARED_SECRET: ${SEVN_PROXY_SHARED_SECRET:-}
      SEVN_TELEGRAM_BOT_TOKEN: ${SEVN_TELEGRAM_BOT_TOKEN:-}
      SEVN_GATEWAY_TOKEN: ${SEVN_GATEWAY_TOKEN:-}
      SEVN_CHROME_EXECUTABLE: /usr/bin/brave-browser
      SEVN_BROWSER_ENGINE: brave
      SEVN_BROWSER_EXTRA_ARGS: "--disable-dev-shm-usage"
    volumes:
      - sevn-state:/operator
      - sevn-browser-state:/operator/workspace/.sevn/browser-profiles
      - ../infra/docker-onboard.json:/bootstrap/onboard-compose.json:ro
    working_dir: /operator/workspace
    ports:
      - "${SEVN_GATEWAY_BIND:-127.0.0.1}:${SEVN_GATEWAY_PORT:-3001}:3001"
    depends_on:
      sevn-operator-perms:
        condition: service_completed_successfully
      sevn-proxy:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
