[project]
name = "sevn"
version = "0.0.0"
description = "Local-first host for persistent AI bots"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "claude-agent-sdk==0.2.168",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "loguru>=0.7.3",
    "pydantic>=2.12",
    "pydantic-ai-slim[anthropic,openai,google]==2.57.0",
    "pydantic-settings>=2.16.0",
    "pyrage>=1.4.0",
    "sqlalchemy[asyncio]>=2.0",
    "typer>=0.27.3",
    "typesafe-sdk==0.7.5",
    "uvicorn[standard]>=0.54.0",
    # google-genai (the pydantic-ai google extra) requires websockets<17.
    "websockets>=13,<17",
]

[dependency-groups]
dev = [
  "freezegun",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[project.scripts]
sevn = "sevn.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sevn"]
