[project]
name = "sevn"
version = "0.0.0"
description = "Local-first host for persistent AI bots"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "freezegun",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sevn"]
