[project]
name = "sevn"
version = "0.0.0"
description = "Local-first host for persistent AI bots"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "keyring>=25.7.0",
    "loguru>=0.7.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.16.0",
    "pyrage>=1.4.0",
]

[dependency-groups]
dev = [
  "freezegun",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sevn"]
