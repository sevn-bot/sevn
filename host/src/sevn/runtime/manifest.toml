# Pinned CLI runtimes for `sevn runtimes install` (plan 0025 D5).
#
# One version per runtime, one entry per platform. `sha256` is the digest of the file
# at `url`; it is checked before anything is extracted. `format` is the download
# shape (raw | tar.gz | zip), `binary` the entrypoint after extraction, and
# `strip_components` drops leading archive directories. A sevn release updates these
# pins; there is no "latest".

